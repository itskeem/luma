name: CI

on:
  push:
  pull_request:

jobs:
  # The part that is also verifiable off Windows: logic and front end.
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: cargo test -p luma-core

  # The real target. This job is what proves the Windows media bridge compiles
  # and the installers build; the Linux job cannot.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: luma-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
